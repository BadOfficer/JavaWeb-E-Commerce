<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <style>
        body {
            background-color: #151515;
        }
        .card {
            width: 600px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background-color: #494949;
            color: white;
            padding: 10px;

            h1 {
                font-weight: bold;
                font-size: 30px;
            }

            p {
                font-size: 20px;
                a {
                    text-decoration: none;
                    font-weight: bold;
                    text-transform: uppercase;
                    color: darkkhaki;
                }
            }
        }
        .card__img {
            border-radius: 50%;
            position: relative;
            max-width: 100px;
            overflow: hidden;
            aspect-ratio: 1/1;

            img {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card__img">
            <img th:src="${avatarUrl}" alt="GitHub Avatar" width="100" height="100"/>
        </div>
        <h1 th:text="'Welcome to Cosmo-Cats - ' + ${username}"></h1>
        <p>You are logged in via <a th:href="${githubProfileUrl}" target="_blank">GitHub</a></p>
    </div>
</body>
</html>
